<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ReelXP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ReelXP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --bg2:#0b0b0b; --card:#0f0f0f; --card2:#171717; --line:#1f1f1f; --line2:#2a2a2a;
  --tx:#f2f2f2; --mute:#8c8c8c; --dim:#555;
  --gold:#d4af61; --gold2:#ecd08f; --goldsoft:rgba(212,175,97,.12); --red:#e5534b;
  --r:14px; --font:'Inter',system-ui,-apple-system,sans-serif; --disp:'Inter Tight','Inter',sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:24px;height:24px}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;width:100%;outline:none}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
#app{max-width:560px;margin:0 auto;padding:var(--st) 20px calc(100px + var(--sb));min-height:100vh}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.02em;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px;gap:10px}
.top h1{font-size:28px}
.logo{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.03em;display:flex;align-items:flex-start;gap:2px}
.logo sup{font-size:9.5px;font-weight:600;letter-spacing:.12em;color:var(--gold);margin-top:5px;line-height:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--tx);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px;gap:10px}
.sec h2{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sec a,.link{color:var(--gold);font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:none}
.mute{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.pill.gold{border-color:rgba(212,175,97,.45);color:var(--gold)}
.pill.solid{background:var(--gold);border-color:var(--gold);color:#000}
.lvl .row{display:flex;align-items:center;gap:16px}
.badge{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-family:var(--disp);font-weight:500;font-size:22px;flex:none;text-align:center;line-height:1}
.badge small{display:block;font-size:8px;letter-spacing:.18em;margin-bottom:2px;font-weight:600;color:var(--mute);font-family:var(--font)}
.rank{font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:-.02em}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.bar{height:3px;border-radius:9px;background:var(--line2);overflow:hidden;margin:16px 0 8px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .5s}
.bar.thin{height:2px;margin:8px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.kpi{text-align:center;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi b{display:block;font-family:var(--disp);font-size:20px;font-weight:500}
.kpi span{font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:10px 0;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.poster{width:44px;height:66px;border-radius:6px;flex:none;display:grid;place-items:center;font-family:var(--disp);font-weight:500;font-size:14px;color:var(--gold);background:var(--card2);border:1px solid var(--line);position:relative;overflow:hidden;letter-spacing:.04em}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster.lg{width:100px;height:150px;border-radius:10px;font-size:26px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.poster.md{width:58px;height:87px;border-radius:7px}
.item .meta{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:var(--gold);border-color:var(--gold);color:#000}
.chk.part{border-color:var(--gold);color:var(--gold);font-size:9px;font-weight:600}
.rk{width:26px;text-align:right;font-family:var(--disp);font-weight:500;color:var(--dim);flex:none;font-size:13px;font-variant-numeric:tabular-nums}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.hscroll::-webkit-scrollbar{display:none}
.cont{flex:none;width:236px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cont .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);font-weight:500;font-size:14px;text-decoration:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600}
.btn.done{border-color:rgba(212,175,97,.5);color:var(--gold)}
.btn.red{border-color:rgba(229,83,75,.35);color:var(--red)}
.btn.block{width:100%}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5}
.seg{display:flex;border-bottom:1px solid var(--line);gap:20px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:10px 0;font-size:14px;font-weight:500;color:var(--mute);white-space:nowrap;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--tx);border-color:var(--gold)}
.seg button .dim{font-size:12px;margin-left:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;font-weight:500;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.empty{text-align:center;color:var(--mute);padding:36px 16px}
.empty .e{display:flex;justify-content:center;color:var(--gold);margin-bottom:12px}
.empty .e svg.i{width:30px;height:30px;stroke-width:1.2}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20;padding-bottom:var(--sb)}
nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:8px 6px 8px}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--dim);width:64px;letter-spacing:.02em}
nav button.on{color:var(--gold)}
nav button.add{color:var(--tx)}
nav button.add .ic{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#000;display:grid;place-items:center}
nav button.add .ic svg{stroke-width:2}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;height:calc(94vh - var(--st));background:var(--bg2);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:560px;margin:0 auto;border-top:1px solid var(--line2);overflow:hidden}
.sheet.on{transform:none}
.sheet .x{position:absolute;right:14px;top:14px;z-index:3;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-color:rgba(255,255,255,.12)}
.sheet .body{overflow-y:auto;padding:0 20px calc(34px + var(--sb));-webkit-overflow-scrolling:touch;flex:1}
.hero{height:190px;margin:0 -20px -92px;background-size:cover;background-position:center 25%;position:relative}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,.15),rgba(11,11,11,.65) 55%,var(--bg2))}
.hero.none{height:60px;margin-bottom:0;background:none}
.dhead{display:flex;gap:16px;margin:0 0 14px;position:relative;z-index:2;align-items:flex-end}
.dhead h2{font-size:24px;line-height:1.1}
.facts{font-size:13px;color:var(--mute);margin-top:5px}
.facts b{color:var(--tx);font-weight:500}
.overview{font-size:14px;color:#bdbdbd;line-height:1.6;margin:6px 0 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.acts .btn{flex:1;min-width:140px}
.stars{display:flex;gap:6px;align-items:center}
.star{position:relative;width:34px;height:34px}
.star svg{width:34px;height:34px;display:block}
.star .e path{fill:none;stroke:var(--line2);stroke-width:1.3}
.star .fw{position:absolute;top:0;left:0;height:100%;overflow:hidden}
.star .fw path{fill:var(--gold);stroke:var(--gold);stroke-width:1.3}
.star button{position:absolute;top:0;height:100%;width:50%}
.star .hl{left:0}.star .hr{right:0}
.rval{font-family:var(--disp);font-weight:500;font-size:18px;margin-left:8px;color:var(--gold);font-variant-numeric:tabular-nums}
.season{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.season .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.season .h b{font-weight:500}
details.season summary{list-style:none;cursor:pointer}
details.season summary::-webkit-details-marker{display:none}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.ep{height:36px;border-radius:8px;border:1px solid var(--line2);font-weight:500;font-size:13px;color:var(--mute)}
.ep.on{background:var(--gold);border-color:var(--gold);color:#000}
.ep.next{border-color:var(--gold);color:var(--gold)}
.eplist{display:flex;flex-direction:column;margin-top:8px}
.eprow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%;font-size:13.5px}
.eprow .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.eprow .ck svg.i{width:12px;height:12px;stroke-width:2.4}
.eprow.on .ck{background:var(--gold);border-color:var(--gold);color:#000}
.eprow.next .ck{border-color:var(--gold)}
.eprow .en{color:var(--dim);font-weight:500;width:28px;flex:none;font-variant-numeric:tabular-nums;font-size:12.5px}
.eprow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eprow.on .nm{color:var(--mute)}
.eprow .ad{color:var(--dim);font-size:11.5px;flex:none}
.eprow.future{opacity:.4;cursor:default}
.spin{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);border-top-color:var(--gold);animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.brow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .c{color:var(--mute);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.brow .b{grid-column:1/3;height:2px;background:var(--line2);border-radius:9px;overflow:hidden}
.brow .b i{display:block;height:100%;background:var(--gold)}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.cols .col i{display:block;width:100%;max-width:22px;background:var(--gold);border-radius:3px 3px 0 0;min-height:1px;opacity:.9}
.cols .col span{font-size:10px;color:var(--mute)}
.cols .col b{font-size:10px;font-weight:500;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid2 .card{margin:0;border:0;border-radius:0}
.big{font-family:var(--disp);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.a{border:1px solid var(--line);border-radius:12px;padding:14px 6px 12px;text-align:center;color:var(--dim)}
.a .i{display:flex;justify-content:center;margin-bottom:8px}
.a .i svg.i{width:22px;height:22px;stroke-width:1.4}
.a.on{border-color:rgba(212,175,97,.35);color:var(--gold)}
.a .n{font-size:11.5px;font-weight:600;color:var(--dim)}
.a.on .n{color:var(--tx)}
.a .d{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.3}
.rrow{display:flex;align-items:center;gap:12px;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rrow .rn{width:52px;font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:.04em}
.rrow.on{color:var(--tx)}
.rrow.lock{color:var(--dim)}
.rrow.lock .rn{opacity:.75}
.rank{font-size:28px;letter-spacing:.04em;line-height:1.15}
/* rank tiers */
[class^="rn-"]{font-family:var(--disp);font-weight:600}
.rn-graphite{color:#7a7a7a}
.rn-steel{color:#9aa3ad}
.rn-copper{color:#b8734a}
.rn-bronze{color:#c48f5a}
.rn-silver{color:#c3c8cf}
.rn-sterling{color:#e6eaef}
.rn-rose{color:#e2aa8f}
.rn-gold{color:#d4af61}
.rn-gilt{background:linear-gradient(180deg,#fff0b8,#e6c06a 45%,#b8892e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rn-platinum{background:linear-gradient(115deg,#ffffff 0%,#cfe6ff 25%,#f4f9ff 45%,#a9cdf5 65%,#ffffff 85%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 0 6px rgba(190,220,255,.35))}
@keyframes shine{to{background-position:-220% 0}}
#toasts{position:fixed;top:calc(14px + var(--st));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(15,15,15,.96);border:1px solid var(--line2);padding:9px 16px;border-radius:99px;font-weight:500;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:tin .3s ease,tout .3s ease 2.4s forwards;display:flex;align-items:center;gap:8px}
.toast.xp{color:var(--gold);border-color:rgba(212,175,97,.4);font-variant-numeric:tabular-nums}
.toast.ach{border-color:rgba(212,175,97,.4)}
.toast.ach svg.i{color:var(--gold);width:16px;height:16px}
@keyframes tin{from{transform:translateY(-16px);opacity:0}}
@keyframes tout{to{transform:translateY(-16px);opacity:0}}
.lvup{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;place-items:center;text-align:center;padding:24px}
.lvup.on{display:grid;animation:tin .35s}
.lvup .badge{width:120px;height:120px;font-size:48px;margin:0 auto 22px;border-width:1.5px}
.lvup .badge small{font-size:10px}
.lvup h2{font-size:30px;font-weight:500;letter-spacing:-.02em}
.res{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.res .meta{flex:1;min-width:0}
.res .t{font-weight:500}
.res .ov{font-size:12.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.res .acts{margin:10px 0 0}
.res .acts .btn{min-width:0;flex:none}
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.note svg.i{color:var(--gold);width:16px;height:16px;margin-top:2px}
.xprow{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.xprow:last-child{border:0}
.xprow b{color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
.searchbar{position:relative}
.searchbar input{padding-left:42px;border-radius:12px;height:48px}
.searchbar .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.feed .f{display:flex;gap:12px;align-items:center;font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.feed .f:last-child{border:0}
.feed .f .w{flex:none;color:var(--dim)}
.feed .f .tm{margin-left:auto;color:var(--dim);font-size:11.5px;white-space:nowrap;padding-left:8px}
.prov{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prov img{width:38px;height:38px;border-radius:9px}
.setup ol{padding-left:18px;margin:10px 0 14px;line-height:1.8;font-size:14px;color:#cfcfcf}
.setup code{background:var(--card2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.tmdb{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--dim);margin-top:28px;line-height:1.4}
.tmdb b{color:var(--mute);font-weight:700;font-size:11px;letter-spacing:.12em;border:1px solid var(--line2);border-radius:4px;padding:2px 5px}
.upnext{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.upnext:last-child{border:0}
.date{flex:none;width:40px;text-align:center;line-height:1.1}
.date b{display:block;font-family:var(--disp);font-size:20px;font-weight:500}
.date span{font-size:9.5px;color:var(--gold);text-transform:uppercase;font-weight:600;letter-spacing:.1em}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet"><button class="iconbtn x" data-act="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="body" id="sheetBody"></div></div>
<div id="toasts"></div>
<div class="lvup" id="lvup" data-act="lvclose"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>

const APP_VERSION = '1.4';
const NOW_YEAR = new Date().getFullYear();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80) || 'x';
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const todayStr = () => dayKey(Date.now());
const plural = (n,w) => n+' '+w+(n===1?'':'s');
const fmtNum = n => n>=10000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : n.toLocaleString();
const yr = d => d ? +String(d).slice(0,4) || null : null;
const fmtDate = (d,opt={day:'numeric',month:'short',year:'numeric'}) => d ? new Date(d+(String(d).length===10?'T12:00:00':'')).toLocaleDateString('en-GB',opt) : '';
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'now'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; if(s<86400*7) return Math.floor(s/86400)+'d'; return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function hash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function initials(t){ const w=String(t).replace(/^(the|a|an)\s+/i,'').split(/[\s:\-]+/).filter(Boolean); return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase(); }
const split = (s,ch) => (s||'').split(ch).map(x=>x.trim()).filter(Boolean);
const IMG = (p,size='w185') => p ? 'https://image.tmdb.org/t/p/'+size+p : '';
function poster(it,size){
  const src = IMG(it.poster, size==='lg'?'w342':'w185');
  return `<div class="poster${size?' '+size:''}">${esc(initials(it.title||'?'))}${src?`<img src="${src}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>`;
}

/* ================= TMDB ================= */
const TMDB = {
  async get(path, params={}, tries=0){
    const k = CFG.key; if(!k) throw {code:'nokey'};
    const u = new URL('https://api.themoviedb.org/3'+path);
    u.searchParams.set('language','en-GB');
    for(const [a,b] of Object.entries(params)) if(b!=null && b!=='') u.searchParams.set(a,b);
    const h = {accept:'application/json'};
    if(k.startsWith('eyJ')) h.Authorization = 'Bearer '+k; else u.searchParams.set('api_key',k);
    let r;
    try{ r = await fetch(u, {headers:h}); }catch(e){ throw {code:'offline'}; }
    if(r.status===401) throw {code:'badkey'};
    if(r.status===429 && tries<2){ await sleep(1200*(tries+1)); return TMDB.get(path,params,tries+1); }
    if(!r.ok) throw {code:'http', status:r.status};
    return r.json();
  }
};
function errMsg(e){
  if(!e) return 'Something went wrong';
  if(e.code==='nokey') return 'Add your TMDb key in Settings first';
  if(e.code==='badkey') return 'TMDb didn’t accept your key — check it in Settings';
  if(e.code==='offline') return 'You’re offline';
  return 'TMDb didn’t respond — try again';
}
const GN = {'Science Fiction':['Sci-Fi'],'Sci-Fi & Fantasy':['Sci-Fi','Fantasy'],'Action & Adventure':['Action','Adventure'],'War & Politics':['War','Politics'],'Kids':['Family']};
const normGenres = gs => [...new Set((gs||[]).flatMap(g=>GN[g.name||g]||[g.name||g]))].slice(0,4);
const tkey = (type,tid) => (type==='film'?'m':'tv')+tid;
function provFrom(wp){
  const r = wp && wp.results && wp.results[CFG.region]; if(!r) return {list:[], buy:[], link:null};
  const seen=new Set(), list=[], buy=[];
  for(const p of [...(r.flatrate||[]),...(r.free||[]),...(r.ads||[])]) if(!seen.has(p.provider_id)){ seen.add(p.provider_id); list.push(p); }
  for(const p of [...(r.rent||[]),...(r.buy||[])]) if(!seen.has(p.provider_id)){ seen.add(p.provider_id); buy.push(p); }
  return {list, buy:buy.slice(0,6), link:r.link};
}
async function fetchMovie(tid){
  const d = await TMDB.get('/movie/'+tid, {append_to_response:'credits,watch/providers'});
  return { data:{ type:'film', tmdb:d.id, title:d.title, year:yr(d.release_date), release:d.release_date||null,
    dirs:(d.credits?.crew||[]).filter(c=>c.job==='Director').map(c=>c.name),
    cast:(d.credits?.cast||[]).slice(0,10).map(c=>c.name), genres:normGenres(d.genres), rt:d.runtime||null,
    poster:d.poster_path, backdrop:d.backdrop_path, overview:d.overview||'', vote:d.vote_average||null, imdb:d.imdb_id||null },
    prov: provFrom(d['watch/providers']) };
}
async function fetchTV(tid){
  const d = await TMDB.get('/tv/'+tid, {append_to_response:'aggregate_credits,watch/providers,external_ids'});
  const last = d.last_episode_to_air;
  const regular = (d.seasons||[]).filter(s=>s.season_number>0);
  const max = Math.max(0, ...regular.map(s=>s.season_number));
  const seasons = Array.from({length:max}, ()=>0);
  for(const s of regular){
    let n = s.episode_count||0;
    if(last){ if(s.season_number>last.season_number) n=0; else if(s.season_number===last.season_number) n=Math.min(n||last.episode_number, last.episode_number) || last.episode_number; }
    else if(!d.first_air_date || d.first_air_date>todayStr()) n=0;
    seasons[s.season_number-1] = n;
  }
  while(seasons.length && !seasons[seasons.length-1]) seasons.pop();
  const nx = d.next_episode_to_air;
  const ended = d.status==='Ended' || d.status==='Canceled';
  return { data:{ type:'tv', tmdb:d.id, title:d.name, year:yr(d.first_air_date), endYear: ended ? yr(d.last_air_date) : null,
    creators:(d.created_by||[]).map(c=>c.name),
    cast:(d.aggregate_credits?.cast||[]).slice(0,10).map(c=>c.name), genres:normGenres(d.genres),
    rt:(d.episode_run_time||[])[0] || (last&&last.runtime) || null, seasons,
    poster:d.poster_path, backdrop:d.backdrop_path, overview:d.overview||'', vote:d.vote_average||null, status:d.status||null,
    nextAir: nx && nx.air_date ? {s:nx.season_number, e:nx.episode_number, date:nx.air_date, name:nx.name||''} : null,
    network:(d.networks||[])[0]?.name||null, imdb:d.external_ids?.imdb_id||null },
    prov: provFrom(d['watch/providers']) };
}
const fetchDetails = (type,tid) => type==='film' ? fetchMovie(tid) : fetchTV(tid);

async function ensureSeason(it, s, force){
  if(!it.tmdb) return;
  const k = it.tmdb+'-'+s, c = EPC[k];
  if(c && !force){
    const allAired = c.eps.every(e=>e[2] && e[2]<=todayStr());
    if(allAired || Date.now()-c.t < 864e5) return;
  }
  if(SEASON_LOADING.has(k)) return;
  SEASON_LOADING.add(k); renderSheet();
  try{
    const d = await TMDB.get('/tv/'+it.tmdb+'/season/'+s);
    EPC[k] = {t:Date.now(), eps:(d.episodes||[]).map(e=>[e.episode_number, e.name||'', e.air_date||''])};
    const keys = Object.keys(EPC); if(keys.length>400){ keys.sort((a,b)=>EPC[a].t-EPC[b].t).slice(0,100).forEach(x=>delete EPC[x]); }
    LS.set('epc', EPC);
  }catch(e){ toast(errMsg(e)); }
  SEASON_LOADING.delete(k); renderSheet();
}

function parseGreats(raw,type){
  return raw.trim().split('\n').map((l,i)=>{
    const [t,y,d,c,g,r] = l.split('|');
    const o = {type, title:t.trim(), year:+y, cast:split(c,','), genres:split(g,','), rt:+r||null, rank:i+1};
    if(type==='film') o.dirs = split(d,';'); else o.creators = split(d,';');
    o.gid = (type==='film'?'gf-':'gt-') + slug(o.title)+'-'+o.year;
    return o;
  });
}

function buildRev(){
  REV = {};

  TOPREV = {};
  for(const t of ['film','tv']) (TOP[t]?.list||[]).forEach(x=>{ TOPREV[tkey(t,x.tid)] = x.rank; });
}

async function resolveGreat(g){
  if(GRES[g.gid]) return GRES[g.gid];
  const q = g.title.replace(/\s*\((UK|US)\)$/,'');
  const path = g.type==='film' ? '/search/movie' : '/search/tv';
  const yk = g.type==='film' ? 'primary_release_year' : 'first_air_date_year';
  const dateOf = r => r.release_date || r.first_air_date;
  let r = await TMDB.get(path, {query:q, [yk]:g.year});
  let hit = (r.results||[])[0];
  if(!hit){
    r = await TMDB.get(path, {query:q});
    hit = (r.results||[]).slice().sort((a,b)=>Math.abs((yr(dateOf(a))||0)-g.year)-Math.abs((yr(dateOf(b))||0)-g.year) || b.popularity-a.popularity)[0];
  }
  if(!hit) return null;
  GRES[g.gid] = {tid:hit.id, poster:hit.poster_path||null};
  LS.set('gres', GRES); buildRev();
  return GRES[g.gid];
}
let resolving = false;
async function resolveVisibleGreats(){
  if(resolving || !CFG.key) return;
  const todo = GREATS[UI.gType].filter(g=>!GRES[g.gid]);
  if(!todo.length) return;
  resolving = true;
  await pool(todo.map(g=>()=>resolveGreat(g)), 4, ()=>{ if(view==='greats') soonRender(); });
  resolving = false;
  if(view==='greats') soonRender();
}
async function loadTop(type, force){
  const c = TOP[type];
  if(c && !force && Date.now()-c.t < 3*864e5) return c.list;
  const path = type==='film' ? '/movie/top_rated' : '/tv/top_rated';
  const pages = await Promise.all(Array.from({length:13},(_,i)=>TMDB.get(path,{page:i+1,region:''})));
  const seen = new Set(); const list=[];
  for(const p of pages) for(const r of (p.results||[])){ if(seen.has(r.id)) continue; seen.add(r.id);
    list.push({tid:r.id, title:r.title||r.name, year:yr(r.release_date||r.first_air_date), poster:r.poster_path, vote:r.vote_average, rank:list.length+1}); }
  TOP[type] = {t:Date.now(), list:list.slice(0,250)};
  LS.set('top', TOP); buildRev();
  return TOP[type].list;
}
function pool(tasks, n, onEach){
  let i=0, stop=false;
  const run = async ()=>{ while(i<tasks.length && !stop){ const t=tasks[i++]; try{ await t(); }catch(e){ if(e && (e.code==='badkey'||e.code==='nokey'||e.code==='offline')) stop=true; } onEach && onEach(); } };
  return Promise.all(Array.from({length:n}, run));
}

function newItem(d){
  const now=Date.now();
  const it = { id:d.id, type:d.type, title:d.title||'', year:+d.year||null, endYear:d.endYear||null,
    dirs:d.dirs||[], creators:d.creators||[], cast:(d.cast||[]).slice(0,10), genres:(d.genres||[]).slice(0,4), rt:+d.rt||null,
    seasons:(d.seasons||[]).map(n=>+n||0), w:null, eps:{}, wl:false, rating:null, added:now, u:now };
  for(const k of ['tmdb','poster','backdrop','overview','vote','status','nextAir','network','release','manual']) if(d[k]!=null) it[k]=d[k];
  return it;
}
const getItem = id => S.items[id] || TEMP[id];
function ensure(id){ if(!S.items[id] && TEMP[id]){ S.items[id]=TEMP[id]; delete TEMP[id]; } return S.items[id]; }
function touch(it){ it.u=Date.now(); save(); }
const epKey = (s,e) => s+'-'+e;
const totalEps = it => (it.seasons||[]).reduce((a,b)=>a+b,0);
const watchedEps = it => Object.keys(it.eps||{}).filter(k=>{ const [s,e]=k.split('-').map(Number); return s>=1 && s<=(it.seasons||[]).length && e>=1 && e<=it.seasons[s-1]; }).length;
function seasonDone(it,s){ const n=it.seasons[s-1]; if(!n) return false; for(let e=1;e<=n;e++) if(!it.eps[epKey(s,e)]) return false; return true; }
function isComplete(it){ if(it.type==='film') return !!it.w; const t=totalEps(it); return t>0 && watchedEps(it)>=t; }
function isFinished(it){ return it.type==='film' ? !!it.w : isComplete(it) && !it.nextAir && (it.status==='Ended'||it.status==='Canceled'||!it.status); }
function nextEp(it){ for(let s=1;s<=it.seasons.length;s++) for(let e=1;e<=it.seasons[s-1];e++) if(!it.eps[epKey(s,e)]) return [s,e]; return null; }
function status(it){
  if(it.type==='film') return it.w ? 'watched' : it.wl ? 'watchlist' : 'none';
  const n=Object.keys(it.eps||{}).length;
  if(isComplete(it)) return isFinished(it) ? 'watched' : 'caught';
  if(n>0) return 'watching';
  return it.wl ? 'watchlist' : 'none';
}

const ACH_BY = Object.fromEntries(ACH.map(a=>[a[0],a]));

function computeStats(){
  const items = Object.values(S.items);
  const st = { films:0, eps:0, seriesDone:0, classics:0, pre60:0, fresh:0, greatsF:0, greatsT:0, top250:0, rated:0, fives:0, minutes:0,
    dirs:{}, creators:{}, actors:{}, genres:{}, decades:{}, ratings:{}, epDays:{}, filmDays:{}, months:{}, ratingSum:0, events:[] };
  const inc = (o,k,n=1) => { if(k) o[k]=(o[k]||0)+n; };
  for(const it of items){
    const g = greatsOf(it);
    let counted = false;
    if(it.type==='film'){
      if(it.w){
        counted = true; st.films++; st.minutes += it.rt||110;
        if(isClassic(it.year)) st.classics++;
        if(it.year && it.year<1960) st.pre60++;
        if(isFresh(it.year)) st.fresh++;
        if(g) st.greatsF++;
        if(topOf(it)) st.top250++;
        (it.dirs||[]).forEach(d=>inc(st.dirs,d));
        if(it.year) inc(st.decades, Math.floor(it.year/10)*10+'s');
        inc(st.filmDays, dayKey(it.w)); inc(st.months, dayKey(it.w).slice(0,7));
        st.events.push({ts:it.w, it, txt:'Watched'});
      }
    } else {
      const keys = Object.keys(it.eps||{});
      if(keys.length){
        counted = true;
        const n = watchedEps(it); st.eps += n; st.minutes += n*(it.rt||45);
        (it.creators||[]).forEach(c=>inc(st.creators,c));
        if(isClassic(it.year)) st.classics++;
        if(isComplete(it)){ st.seriesDone++; if(g) st.greatsT++; }
        const byDay = {};
        for(const k of keys){ const ts=it.eps[k]; const dk=dayKey(ts); inc(st.epDays,dk); inc(st.months,dk.slice(0,7)); (byDay[dk]=byDay[dk]||[]).push([k,ts]); }
        for(const dk in byDay){ const arr=byDay[dk].sort((a,b)=>b[1]-a[1]); st.events.push({ts:arr[0][1], it, txt: arr.length===1 ? 'Watched S'+arr[0][0].replace('-',' E') : 'Watched '+arr.length+' episodes'}); }
      }
    }
    if(counted){ (it.cast||[]).slice(0,8).forEach(a=>inc(st.actors,a)); (it.genres||[]).forEach(x=>inc(st.genres,x)); }
    if(it.rating!=null){ st.rated++; st.ratingSum+=it.rating; inc(st.ratings, String(it.rating)); if(it.rating===5) st.fives++; }
  }
  st.hours = Math.round(st.minutes/60);
  st.maxEpDay = Math.max(0,...Object.values(st.epDays));
  st.maxFilmDay = Math.max(0,...Object.values(st.filmDays));
  st.decadeCount = Object.keys(st.decades).length;
  st.genreCount = Object.keys(st.genres).length;
  st.avg = st.rated ? st.ratingSum/st.rated : 0;
  st.events.sort((a,b)=>b.ts-a.ts);
  return st;
}
function progress(){
  const st = computeStats();
  const br = {}; let xp = 0;
  const add = (k,n) => { if(n>0){ xp+=n; br[k]=(br[k]||0)+n; } };
  for(const it of Object.values(S.items)){
    const g = greatsOf(it) || topOf(it);
    if(it.type==='film' && it.w){
      add('Films watched', XP.film);
      if(isGolden(it.year)) add('Classics bonus', XP.golden); else if(isClassic(it.year)) add('Classics bonus', XP.classic);
      if(isFresh(it.year)) add('New release bonus', XP.fresh);
      if(g) add('The Greats bonus', XP.greatsFilm);
    }
    if(it.type==='tv'){
      const n = watchedEps(it);
      add('Episodes watched', n*XP.ep);
      if(isClassic(it.year)) add('Classics bonus', n*XP.classicEp);
      let sd=0; for(let s=1;s<=it.seasons.length;s++) if(seasonDone(it,s)) sd++;
      add('Seasons finished', sd*XP.season);
      if(isComplete(it)){ add('Series finished', XP.series); if(g) add('The Greats bonus', XP.greatsSeries); }
    }
    if(it.rating!=null) add('Ratings given', XP.rating);
  }
  add('Genres explored', st.genreCount*XP.genre);
  const ach = new Set(ACH.filter(a=>a[4](st)).map(a=>a[0]));
  add('Achievements', ach.size*XP.ach);
  const level = levelFor(xp);
  return { xp, br, level, ach, st, rank:rankFor(level) };
}

function commit(fn){
  const b = progress(); fn(); const a = progress();
  const d = a.xp - b.xp;
  if(d>0) toast('+'+d+' XP','xp');
  for(const k of a.ach) if(!b.ach.has(k)) toast(ic(ACH_BY[k][1])+' Achievement unlocked · '+esc(ACH_BY[k][2]),'ach',true);
  if(a.level>b.level) setTimeout(()=>levelUp(a, b.rank[1]!==a.rank[1]), 500);
  render();
}
const A = {
  film(id){ commit(()=>{ const it=ensure(id); it.w = it.w ? null : Date.now(); if(it.w) it.wl=false; touch(it); }); },
  ep(id,s,e){ commit(()=>{ const it=ensure(id); const k=epKey(s,e); if(it.eps[k]) delete it.eps[k]; else { it.eps[k]=Date.now(); it.wl=false; } touch(it); }); },
  season(id,s,on){ commit(()=>{ const it=ensure(id); const n=it.seasons[s-1]; const now=Date.now(); for(let e=1;e<=n;e++){ const k=epKey(s,e); if(on){ if(!it.eps[k]) it.eps[k]=now; } else delete it.eps[k]; } if(on) it.wl=false; touch(it); }); },
  upto(id,s,e){ commit(()=>{ const it=ensure(id); const now=Date.now(); for(let a=1;a<=s;a++){ const n=a<s?it.seasons[a-1]:e; for(let b=1;b<=n;b++){ const k=epKey(a,b); if(!it.eps[k]) it.eps[k]=now; } } it.wl=false; touch(it); }); },
  next(id){ const it=getItem(id); const n=it&&nextEp(it); if(n) A.ep(id,n[0],n[1]); },
  wl(id){ commit(()=>{ const it=ensure(id); it.wl=!it.wl; touch(it); }); if(getItem(id)?.wl) toast('Added to Watchlist'); },
  rate(id,v){ commit(()=>{ const it=ensure(id); it.rating = it.rating===v ? null : v; touch(it); }); },
  remove(id){ delete S.items[id]; saveNow(); closeSheet(); render(); toast('Removed'); },
};
// Load full TMDb details for a title, keeping it unsaved until you act on it
const LOADING = new Set();
async function loadTitle(type, tid, preset){
  const id = tkey(type,tid);
  if(!S.items[id] && !TEMP[id]) TEMP[id] = newItem({id, type, tmdb:tid, title:preset?.title||'', year:preset?.year, poster:preset?.poster});
  if(LOADING.has(id)) return id;
  LOADING.add(id); renderSheet();
  try{
    const {data, prov} = await fetchDetails(type, tid);
    const it = getItem(id);
    if(it){ applyDetails(it, data); PROV[id]=prov; if(S.items[id]) save(); }
  }catch(e){ toast(errMsg(e)); }
  LOADING.delete(id); renderSheet(); if(!SHEET) render();
  return id;
}
async function openTitle(type, tid, preset){
  const id = tkey(type,tid);
  if(!S.items[id] && !TEMP[id]) TEMP[id] = newItem({id, type, tmdb:tid, title:preset?.title||'', year:preset?.year, poster:preset?.poster});
  openSheet({kind:'item', id});
  const it = getItem(id);
  const stale = !it.fetched || !PROV[id] || (it.type==='tv' && Date.now()-it.fetched > 6*3600e3);
  if(stale && CFG.key) await loadTitle(type, tid, preset);
}
async function openGreat(g){
  if(!CFG.key){ toast('Add your TMDb key in Settings first'); openSheet({kind:'settings'}); return; }
  const id0 = GRES[g.gid] ? tkey(g.type, GRES[g.gid].tid) : null;
  if(id0) return openTitle(g.type, GRES[g.gid].tid, {title:g.title, year:g.year, poster:GRES[g.gid].poster});
  toast('Finding '+g.title+'…');
  try{ const r = await resolveGreat(g); if(!r) return toast('Couldn’t find that on TMDb'); openTitle(g.type, r.tid, {title:g.title, year:g.year, poster:r.poster}); }
  catch(e){ toast(errMsg(e)); }
}
async function quickFilm(type, tid, preset, mode){
  const id = tkey(type,tid);
  if(!S.items[id]){ if(!getItem(id) || !getItem(id).fetched) await loadTitle(type, tid, preset); }
  if(!getItem(id)?.fetched && !S.items[id]) return;
  if(mode==='wl') A.wl(id); else A.film(id);
}

async function refreshShows(){
  if(!CFG.key) return;
  const due = Object.values(S.items).filter(it=>it.type==='tv' && it.tmdb && (status(it)!=='watched' || it.nextAir) && Date.now()-(it.fetched||0) > 12*3600e3);
  if(!due.length) return;
  await pool(due.map(it=>async ()=>{ const {data,prov}=await fetchTV(it.tmdb); const cur=S.items[it.id]; if(cur){ applyDetails(cur,data); PROV[it.id]=prov; } }), 3);
  saveNow(); render();

// Old ReelXP backups (from the Claude-hosted version) have no TMDb ids: match them up
async function migrateLegacy(){
  if(!CFG.key) return;
  const legacy = Object.values(S.items).filter(it=>!it.tmdb && !it.manual);
  if(!legacy.length) return;
  toast('Matching '+plural(legacy.length,'title')+' with TMDb…');
  let n=0;
  await pool(legacy.map(old=>async ()=>{
    const path = old.type==='film' ? '/search/movie' : '/search/tv';
    const yk = old.type==='film' ? 'primary_release_year' : 'first_air_date_year';
    let r = await TMDB.get(path, {query:old.title.replace(/\s*\((UK|US)\)$/,''), [yk]:old.year||''});
    let hit = (r.results||[])[0];
    if(!hit && old.year){ r = await TMDB.get(path,{query:old.title}); hit=(r.results||[])[0]; }
    if(!hit){ old.manual = true; return; }
    const {data} = await fetchDetails(old.type, hit.id);
    const id = tkey(old.type, hit.id);
    const it = S.items[id] || newItem({id, type:old.type});
    applyDetails(it, data);
    it.w = it.w || old.w; it.wl = (it.wl || old.wl) && !it.w; it.rating = it.rating ?? old.rating;
    it.eps = Object.assign({}, old.eps||{}, it.eps||{}); it.added = Math.min(it.added, old.added||it.added); it.u = Date.now();
    S.items[id] = it; if(old.id!==id) delete S.items[old.id]; n++;
  }), 3);
  saveNow(); render(); if(n) toast('Matched '+plural(n,'title'));
}

            if(e>cnt) return `<div class="eprow future"><span class="ck"></span><span class="en">E${e}</span><span class="nm">${esc(name||'Episode '+e)}</span><span class="ad">${air?fmtDate(air,{day:'numeric',month:'short'}):'TBA'}</span></div>`;
            const on=!!it.eps[epKey(s,e)], nx=n&&n[0]===s&&n[1]===e;
            return `<button class="eprow ${on?'on':''} ${nx?'next':''}" data-act="ep" data-id="${esc(it.id)}" data-s="${s}" data-e="${e}"><span class="ck">${ic('check')}</span><span class="en">E${e}</span><span class="nm">${esc(name||'Episode '+e)}</span><span class="ad">${air?fmtDate(air,{day:'numeric',month:'short',year:'2-digit'}):''}</span></button>`; }).join('')}</div>`;
        } else {
          body = `${sl?'<div class="small mute" style="margin-top:8px"><span class="spin" style="width:12px;height:12px"></span> Loading episode titles…</div>':''}<div class="eps">${Array.from({length:cnt},(_,k)=>{ const e=k+1, on=!!it.eps[epKey(s,e)], nx=n&&n[0]===s&&n[1]===e; return `<button class="ep ${on?'on':''} ${nx?'next':''}" data-act="ep" data-id="${esc(it.id)}" data-s="${s}" data-e="${e}">${e}</button>`; }).join('')}</div>`;
        }
        h += `<details class="season" data-s="${s}" ${open?'open':''}><summary class="h"><div><b>Season ${s}</b> <span class="small ${ws===cnt?'':'mute'}" style="${ws===cnt?'color:var(--gold)':''}">&nbsp;${ws}/${cnt}</span></div>
          <button class="btn sm" data-act="season" data-id="${esc(it.id)}" data-s="${s}" data-on="${ws===cnt?0:1}">${ws===cnt?'Unmark all':'Mark all'}</button></summary>${body}</details>`;
        if(open && it.tmdb && !meta && !sl) setTimeout(()=>ensureSeason(it,s),0);
      });
      h += `<div class="small dim">Catching up? <a class="link" data-act="catchup">Mark everything up to an episode</a>.</div>`;
      if(SHEET.catchup) h += `<form class="card form" style="margin-top:10px" data-form="catchup"><div class="row2"><label>Season<input name="s" inputmode="numeric" value="${n?n[0]:1}"></label><label>Episode<input name="e" inputmode="numeric" value="${n?n[1]:1}"></label></div><button class="btn gold block">Mark all up to here as watched</button></form>`;
    }
    if(!it.tmdb){
      if(SHEET.editSeasons) h += `<form class="card form" style="margin-top:10px" data-form="seasons"><label>Episodes per season<input name="seasons" value="${esc(it.seasons.join(', '))}" placeholder="e.g. 10, 13, 13"></label><button class="btn gold block">Save</button></form>`;
      else if(it.seasons.length) h += `<div class="small dim" style="margin-top:6px"><a class="link" data-act="editseasons">Edit seasons</a></div>`;
    }
  }
  h += provHTML(it.id);
  if(it.tmdb) h += `<div class="small" style="margin-top:18px;display:flex;gap:14px"><a class="link" href="https://www.themoviedb.org/${it.type==='film'?'movie':'tv'}/${it.tmdb}" target="_blank" rel="noopener">TMDb</a>${it.imdb?`<a class="link" href="https://www.imdb.com/title/${esc(it.imdb)}/" target="_blank" rel="noopener">IMDb</a>`:''}${g?`<a class="link" data-act="rematch">Wrong title?</a>`:''}</div>`;
  if(saved) h += `<div style="margin-top:22px"><button class="btn red block" data-act="${SHEET.confirmDel?'remove':'askremove'}" data-id="${esc(it.id)}">${SHEET.confirmDel?'Tap again to remove from library':'Remove from library'}</button></div>`;
  b.innerHTML = h;
  b.scrollTop = st0;
}
function settingsHTML(){
  const n = Object.keys(S.items).length;
  const masked = CFG.key ? CFG.key.slice(0,4)+'…'+CFG.key.slice(-4) : '';
  const regions = [['GB','United Kingdom'],['IE','Ireland'],['US','United States'],['CA','Canada'],['AU','Australia'],['NZ','New Zealand'],['DE','Germany'],['FR','France'],['ES','Spain'],['IT','Italy'],['NL','Netherlands'],['IN','India']];
  return `<h2 style="font-size:24px;margin:22px 0 6px">Settings</h2>
  <div class="sec" style="margin-top:6px"><h2>TMDb key</h2>${CFG.key?'<span class="pill gold">Connected</span>':''}</div>
  ${CFG.key?`<div class="small mute" style="margin-bottom:8px">Using key <code>${esc(masked)}</code></div>`:''}
  <form class="form" data-form="key"><input name="key" placeholder="${CFG.key?'Paste a new key to replace it':'Paste your TMDb key'}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn gold block">${CFG.key?'Update key':'Connect'}</button></form>
  ${!CFG.key?`<div class="small mute" style="margin-top:8px">Get one free at <a class="link" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>.</div>`:''}
  <div class="sec"><h2>Streaming region</h2></div>
  <select data-act="region">${regions.map(([k,l])=>`<option value="${k}" ${CFG.region===k?'selected':''}>${l}</option>`).join('')}</select>
  <div class="sec"><h2>Backup</h2></div>
  <div class="small mute" style="margin-bottom:8px">${plural(n,'title')} saved on this device. Download a backup now and then — it’s also how you move your library to a new phone.</div>
  <div class="acts"><button class="btn gold" data-act="download">${ic('download','sm')} Download backup</button><button class="btn" data-act="restorefile">${ic('upload','sm')} Restore from file</button></div>
  <div class="acts" style="margin-top:0"><button class="btn" data-act="copybackup">${ic('copy','sm')} Copy as text</button><button class="btn" data-act="showrestore">Paste a backup</button></div>
  ${SHEET.backupText?`<textarea rows="5" readonly onclick="this.select()">${esc(SHEET.backupText)}</textarea>`:''}
  ${SHEET.restore?`<form class="form" data-form="restore"><textarea name="data" rows="5" placeholder="Paste a backup here (works with backups from the Claude version too)"></textarea><button class="btn gold block">Restore (merges with your library)</button></form>`:''}
  <div class="sec"><h2>Add to Home Screen</h2></div>
  <div class="small mute" style="line-height:1.6"><b style="color:var(--tx);font-weight:500">iPhone</b> — Safari → Share → Add to Home Screen.<br><b style="color:var(--tx);font-weight:500">Android</b> — Chrome → ⋮ → Add to Home screen.</div>
  <div class="small dim" style="margin-top:22px">ReelXP version ${APP_VERSION}</div>
  <div class="sec"><h2>Danger zone</h2></div>
  <button class="btn red block" data-act="${SHEET.confirmWipe?'wipe':'askwipe'}">${SHEET.confirmWipe?'Tap again to erase everything on this device':'Erase all data'}</button>
  ${attribution()}`;
}

/* ================= TOASTS & LEVEL UP ================= */
function toast(msg,cls='',html=false){ const t=document.createElement('div'); t.className='toast '+cls; if(html) t.innerHTML=msg; else t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),2900); }
function levelUp(P, newRank){
  const el=$('#lvup');
  el.innerHTML = `<div><div class="badge"><div><small>LVL</small>${P.level}</div></div><div class="eyebrow" style="margin-bottom:8px">Level up</div><h2>${newRank?`Rank ${rankTag(P.rank)}`:'Level '+P.level}</h2>
    <p class="mute" style="margin:8px 0 22px">${newRank?`New rank unlocked at level ${P.level}`:`${fmtNum(P.xp)} XP and counting`}</p>
    <button class="btn gold" data-act="lvclose" style="min-width:170px">Continue</button></div>`;
  el.classList.add('on');
}

/* ================= BACKUP ================= */
const backupJSON = () => JSON.stringify({app:'reelxp', v:2, exported:new Date().toISOString(), items:S.items, gres:GRES});
function restoreFrom(text){
  let d; try{ d=JSON.parse(text); }catch(_){ toast('That doesn’t look like a ReelXP backup'); return; }
  const items = d.items || d; let n=0;
  commit(()=>{ for(const id in items){ const it=items[id]; if(it && it.id && it.type && it.title!=null){ const cur=S.items[it.id]; if(!cur || (it.u||0)>(cur.u||0)){ S.items[it.id]=it; n++; } } } saveNow(); });
  if(d.gres) { GRES=Object.assign({}, d.gres, GRES); LS.set('gres',GRES); buildRev(); }
  toast('Restored '+plural(n,'title'));
  if(SHEET){ SHEET.restore=false; renderSheet(); }
  migrateLegacy();
}

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(el.tagName==='SELECT') return;
  if(el.tagName==='A' && el.getAttribute('href')) return;
  e.preventDefault(); e.stopPropagation();
  switch(act){
    case 'nav': view=el.dataset.v; history.replaceState(null,'','#'+view); closeSheet(); $('#app').innerHTML=''; render(); scrollTo(0,0); break;
    case 'lib': view='library'; UI.lib=el.dataset.v; history.replaceState(null,'','#library'); $('#app').innerHTML=''; render(); scrollTo(0,0); break;
    case 'open': openItem(id); break;
    case 'close': closeSheet(); break;
    case 'film': A.film(id); break;
    case 'ep': A.ep(id,+el.dataset.s,+el.dataset.e); break;
    case 'season': A.season(id,+el.dataset.s,el.dataset.on==='1'); break;
    case 'next': A.next(id); break;
    case 'wl': A.wl(id); break;
    case 'rate': A.rate(id,+el.dataset.v); break;
    case 'askremove': SHEET.confirmDel=true; renderSheet(); break;
    case 'remove': A.remove(id); break;
    case 'refresh': { const it=getItem(id); if(it?.tmdb){ loadTitle(it.type,it.tmdb).then(()=>{ (it.seasons||[]).forEach((c,i)=>{ if(c && EPC[it.tmdb+'-'+(i+1)]) ensureSeason(it,i+1,true); }); }); } break; }
    case 'catchup': SHEET.catchup=!SHEET.catchup; renderSheet(); break;
    case 'editseasons': SHEET.editSeasons=!SHEET.editSeasons; renderSheet(); break;
    case 'rematch': { const it=getItem(SHEET.id); const g=greatsOf(it); if(g){ delete GRES[g.gid]; LS.set('gres',GRES); buildRev(); UI.q=g.title; UI.qType=g.type; UI.results=null; closeSheet(); view='add'; $('#app').innerHTML=''; render(); doSearch(); toast('Pick the right one — it’ll be linked to The Greats'); UI.pendingG=g.gid; } break; }
    case 'libseg': UI.lib=el.dataset.v; render(); break;
    case 'libtype': UI.libType=el.dataset.v; render(); break;
    case 'gsrc': CFG.gsrc=el.dataset.v; LS.set('cfg',CFG); UI.gFilter='all'; render(); break;
    case 'gtype': UI.gType=el.dataset.v; UI.gFilter='all'; render(); break;
    case 'gfilter': UI.gFilter=el.dataset.v; render(); break;
    case 'great': openGreat(GBYID[el.dataset.gid]); break;
    case 'gquick': { const g=GBYID[el.dataset.gid]; if(!CFG.key){ openSheet({kind:'settings'}); break; }
      (async()=>{ try{ const r=await resolveGreat(g); if(r) await quickFilm(g.type, r.tid, {title:g.title,year:g.year,poster:r.poster}, 'watched'); }catch(err){ toast(errMsg(err)); } })(); break; }
    case 'topopen': { const x=TOP[UI.gType].list.find(x=>x.tid==el.dataset.tid); openTitle(UI.gType, x.tid, x); break; }
    case 'topquick': { const x=TOP[UI.gType].list.find(x=>x.tid==el.dataset.tid); quickFilm(UI.gType, x.tid, x, 'watched'); break; }
    case 'toprefresh': fetchTop(true); break;
    case 'qtype': UI.qType=el.dataset.v; $('#app').innerHTML=''; render(); if(UI.q) doSearch(); break;
    case 'manual': UI.manual=!UI.manual; $('#app').innerHTML=''; render(); break;
    case 'mtype': UI.mType=el.dataset.v; $('#app').innerHTML=''; render(); break;
    case 'settings': openSheet({kind:'settings'}); break;
    case 'lvclose': $('#lvup').classList.remove('on'); break;
    case 'download': {
      const blob = new Blob([backupJSON()], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reelxp-backup-'+todayStr()+'.json';
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      LS.set('lastBackup', Date.now()); toast('Backup downloaded'); break; }
    case 'restorefile': $('#fileIn').click(); break;
    case 'copybackup': {
      const txt = backupJSON();
      const done = ok => { SHEET.backupText = ok ? null : txt; renderSheet(); toast(ok?'Backup copied':'Select and copy the text below'); };
      try{ navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false)); }catch(_){ done(false); }
      break; }
    case 'showrestore': SHEET.restore=!SHEET.restore; renderSheet(); break;
    case 'askwipe': SHEET.confirmWipe=true; renderSheet(); break;
    case 'wipe': S.items={}; GRES={}; EPC={}; TOP={}; ['items','gres','epc','top'].forEach(k=>{ try{localStorage.removeItem('reelxp.'+k)}catch(_){} }); buildRev(); closeSheet(); render(); toast('All data erased'); break;
    case 'res': {
      const x = UI.results[+el.dataset.i]; const m = el.dataset.m;
      if(UI.pendingG){ const g=GBYID[UI.pendingG]; if(g && g.type===x.type){ GRES[g.gid]={tid:x.tid, poster:x.poster}; LS.set('gres',GRES); buildRev(); toast('Linked to The Greats #'+g.rank); } UI.pendingG=null; }
      if(m==='wl') quickFilm(x.type, x.tid, x, 'wl');
      else if(m==='watched') quickFilm(x.type, x.tid, x, 'watched').then(()=>openTitle(x.type, x.tid, x));
      else openTitle(x.type, x.tid, x);
      break; }
  }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-act="libsort"]')){ UI.libSort=e.target.value; render(); }
  if(e.target.matches('[data-act="region"]')){ CFG.region=e.target.value; LS.set('cfg',CFG); for(const k in PROV) delete PROV[k]; toast('Region set to '+CFG.region); }
  if(e.target.id==='fileIn'){ const f=e.target.files[0]; if(f) f.text().then(restoreFrom); e.target.value=''; }
});
document.addEventListener('toggle', e=>{ const d=e.target; if(d.matches && d.matches('details.season') && SHEET && SHEET.kind==='item'){ SHEET.open=SHEET.open||{}; const s=+d.dataset.s; if(SHEET.open[s]!==d.open){ SHEET.open[s]=d.open; if(d.open){ const it=getItem(SHEET.id); if(it && it.tmdb) ensureSeason(it,s); } } } }, true);
let qTimer=null;
document.addEventListener('input', e=>{ if(e.target.id==='q'){ UI.q=e.target.value.trim(); clearTimeout(qTimer); if(!UI.q){ UI.results=null; UI.searchErr=''; renderResults(); return; } qTimer=setTimeout(doSearch, 380); } });
document.addEventListener('submit', async e=>{
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form;
  if(kind==='search'){ UI.q = f.querySelector('#q').value.trim(); f.querySelector('#q').blur(); if(UI.q) doSearch(); }
  if(kind==='key'){
    const k = (f.elements.key.value||'').trim(); if(!k) return;
    const old = CFG.key; CFG.key = k;
    try{ await TMDB.get('/configuration'); LS.set('cfg',CFG); toast('TMDb connected'); if(SHEET) renderSheet(); $('#app').innerHTML=''; render(); migrateLegacy(); refreshShows(); }
    catch(err){ CFG.key = old; toast(err.code==='badkey'?'TMDb didn’t accept that key':errMsg(err)); }
  }
  if(kind==='manual'){
    const v = k => (f.elements[k]?.value||'').trim();
    const type = UI.mType==='tv'?'tv':'film';
    if(!v('title')) return;
    const d = {type, manual:true, title:v('title'), year:+v('year')||null, rt:+v('rt')||null, cast:split(v('cast'),','), genres:split(v('genres'),','), seasons:split(v('seasons'),',').map(Number).filter(n=>n>0)};
    if(type==='film') d.dirs=split(v('who'),','); else d.creators=split(v('who'),',');
    d.id = 'x'+(type==='film'?'m':'t')+'-'+slug(d.title)+'-'+(d.year||'na');
    if(!S.items[d.id]){ S.items[d.id]=newItem(d); touch(S.items[d.id]); }
    toast('Added '+d.title); UI.manual=false; $('#app').innerHTML=''; render(); openItem(d.id);
  }
  if(kind==='seasons'){ const it=ensure(SHEET.id); it.seasons=split(f.elements.seasons.value,',').map(Number).filter(n=>n>0); touch(it); SHEET.editSeasons=false; render(); }
  if(kind==='catchup'){ const it=getItem(SHEET.id); const valid=it.seasons.map((c,i)=>c?i+1:0).filter(Boolean); let s=+f.elements.s.value||1; if(!it.seasons[s-1]) s=valid[0]; const ep=Math.max(1,Math.min(it.seasons[s-1],+f.elements.e.value||1)); SHEET.catchup=false; A.upto(SHEET.id,s,ep); }
  if(kind==='restore'){ restoreFrom(f.elements.data.value); }
});
let searchToken = 0;
async function doSearch(){
  const tok = ++searchToken;
  UI.searching=true; UI.searchErr=''; renderResults();
  try{
    const path = UI.qType==='film' ? '/search/movie' : UI.qType==='tv' ? '/search/tv' : '/search/multi';
    const d = await TMDB.get(path, {query:UI.q, include_adult:'false'});
    if(tok!==searchToken) return;
    UI.results = (d.results||[]).map(r=>{ const type = UI.qType!=='all' ? UI.qType : r.media_type==='movie' ? 'film' : r.media_type==='tv' ? 'tv' : null;
      return type && {type, tid:r.id, title:r.title||r.name, year:yr(r.release_date||r.first_air_date), poster:r.poster_path, overview:r.overview||'', vote:r.vote_average||0, pop:r.popularity||0}; })
      .filter(Boolean).slice(0,15);
  }catch(e){ if(tok!==searchToken) return; UI.results=null; UI.searchErr=errMsg(e); }
  UI.searching=false; renderResults();
}
window.addEventListener('hashchange', ()=>{ const v=location.hash.slice(1); if(VIEWS.includes(v) && v!==view){ view=v; $('#app').innerHTML=''; render(); } });

/* ================= START ================= */
render();
if(CFG.key){ setTimeout(()=>{ refreshShows(); migrateLegacy(); }, 800); }
if('serviceWorker' in navigator && location.protocol==='https:'){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg=>{
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!hadController || reloaded) return; reloaded = true; saveNow(); location.reload(); });
}
</script>
